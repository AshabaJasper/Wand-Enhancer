<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">Recover after a Wand update</title><desc id="desc">Finish the update and close games. Rescan the installation. Reapply if support files are healthy; otherwise preserve the backups and restore. Verify the PC and phone libraries.</desc><rect width="1000" height="260" rx="24" fill="#10131a"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="53" font-size="25" font-weight="700" fill="#fff">An update should have a clear way back.</text><path d="M82 113H906" stroke="#ddf86c" stroke-width="3"/><g fill="#ddf86c"><circle cx="82" cy="113" r="9"/><circle cx="354" cy="113" r="9"/><circle cx="626" cy="113" r="9"/><circle cx="906" cy="113" r="9"/></g><g fill="#fff" font-size="19" font-weight="600"><text x="36" y="157">Finish update</text><text x="293" y="157">Rescan</text><text x="542" y="157">Reapply / Restore</text><text x="808" y="157">Verify libraries</text></g><g fill="#b8c1d1" font-size="15"><text x="36" y="188">Close your game first</text><text x="293" y="188">Check version + files</text><text x="542" y="188">Keep original backups</text><text x="808" y="188">PC, then phone</text></g><text x="36" y="232" fill="#f3c978" font-size="14">Unsupported update? Keep the logs and original backups. Wait for a compatible Enhancer build.</text></g></svg>
